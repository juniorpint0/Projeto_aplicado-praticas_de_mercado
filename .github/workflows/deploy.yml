name: CI/CD Pipeline - Deploy para Servidor Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  audit-and-deploy:
    name: Validação de Segurança & Deploy em Produção
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🛡️ Auditoria de Segurança: Verificação de Chaves Expostas (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🚀 Deploy Seguro via SSH (Rsync para /var/www/html)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "index.html,css/,js/"
          target: "/tmp/deploy_staging"

      - name: ⚙️ Aplicação de Permissões e Atualização do Web Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            sudo cp -r /tmp/deploy_staging/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html/
            sudo chmod -R 755 /var/www/html/
            rm -rf /tmp/deploy_staging
            sudo systemctl reload nginx || sudo systemctl reload apache2
            echo "✅ Deploy concluído com sucesso e permissões aplicadas!"
