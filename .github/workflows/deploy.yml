name: "CI/CD Pipeline - Deploy para Servidor Cloud"

on:
  push:
    branches: [ "main" ]

jobs:
  audit-and-deploy:
    name: "Validacao de Seguranca e Deploy em Producao"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositorio"
        uses: actions/checkout@v4

      - name: "Auditoria de Seguranca - Verificacao de Chaves Expostas (Gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: "Deploy Seguro via SSH (SCP para /var/www/html)"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "index.html,css/,js/"
          target: "/tmp/deploy_staging"

      - name: "Aplicacao de Permissoes e Atualizacao do Web Server"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo cp -r /tmp/deploy_staging/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html/
            sudo chmod -R 755 /var/www/html/
            rm -rf /tmp/deploy_staging
            sudo systemctl reload nginx || sudo systemctl reload apache2
            echo "Deploy concluido com sucesso e permissoes aplicadas!"
